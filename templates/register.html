<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <style>

        body{
            font-family:Arial;
            background:linear-gradient(to right,#11998e,#38ef7d);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .register-box{
            background:white;
            padding:40px;
            width:400px;
            border-radius:10px;
            box-shadow:0px 0px 15px gray;
        }

        h2{
            text-align:center;
            color:#11998e;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#11998e;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
        }

    </style>

</head>

<body>

<div class="register-box">

    <h2>Create Account</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Enter Username">

        <input type="email" name="email" placeholder="Enter Email">

        <input type="password" name="password" placeholder="Enter Password">

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
