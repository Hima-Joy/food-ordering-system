<!DOCTYPE html>
<html>

<head>

    <title>Cart</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
        }

        .container{
            width:600px;
            margin:auto;
            margin-top:50px;
        }

        .card{
            background:white;
            padding:20px;
            margin-top:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        button{
            background:#ff6b35;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Your Cart</h1>

{% for item in cartitems %}

<div class="card">

<h2>{{ item.food_name }}</h2>

<h3>₹{{ item.price }}</h3>

</div>

{% endfor %}

<br>

<a href="/placeorder">
    <button>Place Order</button>
</a>

</div>

</body>

</html>
