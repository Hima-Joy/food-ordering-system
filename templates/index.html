<!DOCTYPE html>
<html>
<head>
    <title>Food Ordering System</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f4f6f9;
        }

        .navbar{
            background:#ff6b35;
            padding:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar h2{
            color:white;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-weight:bold;
        }

        .hero{
            text-align:center;
            padding:100px;
            background:linear-gradient(to right,#ff9966,#ff5e62);
            color:white;
        }

        .hero h1{
            font-size:50px;
        }

        .hero p{
            font-size:20px;
        }

        .btn{
            background:white;
            color:#ff5e62;
            padding:12px 25px;
            text-decoration:none;
            border-radius:5px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>FoodExpress</h2>

    <div>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
        <a href="/addfood">Admin Panel</a>
    </div>

</div>

<div class="hero">

    <h1>Welcome to Food Ordering System</h1>

    <p>Order Delicious Food Online Easily</p>

    <br>

    <a href="/login" class="btn">Order Now</a>

</div>

</body>
</html>
