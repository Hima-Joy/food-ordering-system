<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
            margin:0;
        }

        .navbar{
            background:#222;
            color:white;
            padding:15px;
            text-align:center;
        }

        .foods{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            margin-top:30px;
        }

        .card{
            background:white;
            width:250px;
            margin:20px;
            padding:20px;
            border-radius:10px;
            text-align:center;
            box-shadow:0px 0px 10px gray;
        }

        button{
            background:#ff6b35;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h1>Food Dashboard</h1>

</div>

<div class="foods">

{% for food in foods %}

<div class="card">

    <h2>{{ food.food_name }}</h2>

    <h3>₹{{ food.price }}</h3>

    <a href="/cart/{{ food.id }}">
        <button>Add to Cart</button>
    </a>
    <br><br>

    <a href="/deletefood/{{ food.id }}">
        <button>Delete</button>
    </a>
    <br><br>
    <a href="/editfood/{{ food.id }}">
    <button>Edit</button>
    </a>
</div>

{% endfor %}

</div>

</body>

</html>
