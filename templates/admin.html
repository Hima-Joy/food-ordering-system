<!DOCTYPE html>
<html>

<head>

    <title>Admin Panel</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
        }

        .container{
            width:400px;
            margin:auto;
            margin-top:80px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            text-align:center;
            color:#ff6b35;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#ff6b35;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Add Food</h1>

<form method="POST">

<input type="text" name="food_name" placeholder="Food Name">

<input type="number" name="price" placeholder="Price">

<button type="submit">Add Food</button>

</form>

</div>

</body>

</html>
